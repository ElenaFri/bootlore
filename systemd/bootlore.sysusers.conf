# Declarative system account for the optional BootLore boot monitor.
#
# Processed by systemd-sysusers: the account is created automatically at
# install time (see `make install`) and re-ensured at every boot by
# systemd-sysusers.service — no manual useradd is ever needed.
#
# It is an unprivileged, no-login system user with no home directory of its
# own (the read-only monitor persists nothing). Read access to the system
# journal is granted separately by the unit's SupplementaryGroups=.
#
#Type Name     ID GECOS
u     bootlore -  "BootLore boot monitor"

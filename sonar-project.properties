# SonarCloud / SonarQube analysis configuration for BootLore.

# Test code legitimately repeats small setup/assertion blocks for readability.
# Shared test doubles and assertions already live in internal/collectortest;
# the remaining per-test boilerplate is excluded from copy-paste detection.
sonar.cpd.exclusions=**/*_test.go

# internal/collectortest is test scaffolding (imported only by tests): keep it
# out of coverage just like the Codecov report does.
sonar.coverage.exclusions=**/*_test.go,**/collectortest/**
